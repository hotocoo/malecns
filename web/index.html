<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaleCNS connectome driving</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<section class="stage" aria-label="Live simulation">
  <div class="stage-bar">
    <span class="tag">malecns <em>|</em> connectome driving <em>|</em> Circuit de Monaco, W11 dynamics</span>
    <span class="tag right" id="stage-generation">generation -</span>
  </div>

  <div class="stage-grid">
    <figure class="view drive-view">
      <canvas id="drive-canvas"></canvas>
      <canvas id="track-canvas" class="minimap" width="520" height="520"></canvas>
      <figcaption class="overlay">
        <span class="pill" id="pill-state">FORWARD</span>
        <span class="speed" id="pill-speed">0 km/h</span>
        <span class="foot" id="pill-foot">real time · 0.0 s elapsed</span>
      </figcaption>
    </figure>

    <div class="side">
      <figure class="view brain-view">
        <span class="view-label">Fly brain</span>
        <canvas id="brain-canvas"></canvas>
        <figcaption class="hint" id="brain-meta">loading anatomy</figcaption>
      </figure>

      <figure class="view spike-view">
        <span class="view-label">Spikes <small id="raster-meta"></small></span>
        <canvas id="raster-canvas" width="640" height="300"></canvas>
        <figcaption>
          <ul class="legend" id="raster-legend"></ul>
        </figcaption>
      </figure>
    </div>
  </div>

  <div class="stage-strip">
    <div class="gauge">
      <span class="gauge-label">steer</span>
      <div class="bar bipolar"><i id="bar-steer"></i></div>
      <output id="val-steer">0.00</output>
    </div>
    <div class="gauge">
      <span class="gauge-label">pedal</span>
      <div class="bar bipolar"><i id="bar-throttle"></i></div>
      <output id="val-throttle">0.00</output>
    </div>
    <dl class="strip-readout">
      <div><dt>lap</dt><dd id="stat-laps">-</dd></div>
      <div><dt>spiking</dt><dd id="stat-spiking">-</dd></div>
      <div><dt>steps</dt><dd id="stat-fps">-</dd></div>
      <div><dt>headroom</dt><dd id="stat-realtime">-</dd></div>
      <div><dt>link</dt><dd id="stat-link" class="bad">connecting</dd></div>
    </dl>
  </div>
</section>

<main>
  <section class="panel rates" aria-labelledby="rates-heading">
    <h2 id="rates-heading">Population rate <small>Hz per neuron</small></h2>
    <ul class="rate-list" id="rate-list"></ul>
  </section>

  <section class="panel dn" aria-labelledby="dn-heading">
    <h2 id="dn-heading">Descending neurons <small>top steering influence</small></h2>
    <ul class="dn-list" id="dn-list"></ul>
  </section>

  <section class="panel curve" aria-labelledby="curve-heading">
    <h2 id="curve-heading">Training <small id="curve-meta"></small></h2>
    <canvas id="curve-canvas" width="1200" height="220"></canvas>
  </section>
</main>

<footer>
  <span id="footer-meta">loading connectome</span>
</footer>

<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js" } }
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
