<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">connectome driving</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Every label, number, colour and dimension on this page comes from the
       server (/api/meta, /api/track, /api/config, /api/training, the frame
       stream). The markup below is only the layout skeleton. -->
  <section class="stage" aria-label="Live simulation">
    <div class="stage-bar">
      <span class="tag" id="stage-title">loading</span>
      <button class="tag button" id="camera-toggle" type="button" title="switch between chase camera and the fly's cockpit">cockpit view</button>
      <span class="tag right" id="stage-generation"></span>
    </div>
    <div class="stage-grid">
      <figure class="view drive-view">
        <canvas id="drive-canvas"></canvas>
        <canvas id="track-canvas" class="minimap"></canvas>
        <figcaption class="overlay">
          <span class="pill" id="pill-state"></span>
          <span class="speed" id="pill-speed"></span>
          <span class="foot" id="pill-foot"></span>
        </figcaption>
      </figure>
      <div class="side">
        <figure class="view brain-view">
          <span class="view-label" id="brain-label"></span>
          <canvas id="brain-canvas"></canvas>
          <figcaption class="hint" id="brain-meta"></figcaption>
        </figure>
        <figure class="view fleet-view">
          <span class="view-label" id="fleet-label"></span>
          <canvas id="fleet-canvas" title="click a row to follow that car"></canvas>
        </figure>
        <figure class="view spike-view">
          <span class="view-label" id="raster-label"></span>
          <canvas id="raster-canvas"></canvas>
          <figcaption><ul class="legend" id="raster-legend"></ul></figcaption>
        </figure>
      </div>
    </div>
    <div class="stage-strip">
      <div id="gauges" class="gauges"></div>
      <dl class="strip-readout" id="strip-readout"></dl>
    </div>
  </section>

  <main class="panels">
    <section class="panel fly-panel" aria-labelledby="fly-heading">
      <h2 id="fly-heading"></h2>
      <div class="fly-grid">
          <figure class="fly-cell fp-cell">
            <canvas id="fp-canvas"></canvas>
            <figcaption id="fp-caption"></figcaption>
          </figure>
        <figure class="fly-cell">
          <canvas id="eyes-canvas"></canvas>
          <figcaption id="eyes-caption"></figcaption>
        </figure>
        <figure class="fly-cell">
          <canvas id="controls-canvas"></canvas>
          <figcaption id="controls-caption"></figcaption>
        </figure>
        <div class="fly-cell" id="fly-telemetry"></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="telemetry-heading">
      <h2 id="telemetry-heading"></h2>
      <div class="telemetry-grid" id="telemetry"></div>
    </section>

    <section class="panel two-col">
      <div>
        <h2 id="rates-heading"></h2>
        <ul class="rate-list" id="rate-list"></ul>
      </div>
      <div>
        <h2 id="dn-heading"></h2>
        <ul class="dn-list" id="dn-list"></ul>
      </div>
    </section>

    <section class="panel curve" aria-labelledby="curve-heading">
      <h2 id="curve-heading"></h2>
      <div class="trainer-toolbar">
        <div>
          <span class="toolbar-label">trainer fleet</span>
          <span class="toolbar-note" id="trainer-fleet-note"></span>
        </div>
        <div class="trainer-actions">
          <select id="trainer-select" aria-label="Select trainer"></select>
          <button id="trainer-refresh" type="button">refresh</button>
        </div>
      </div>
      <div class="trainer-fleet" id="trainer-fleet"></div>
      <div class="trainer-quick-actions" id="trainer-quick-actions" aria-label="Trainer selection shortcuts">
        <button type="button" data-trainers="all">all</button>
        <button type="button" data-trainers="best2">best 2</button>
        <button type="button" data-trainers="none">none</button>
      </div>
      <div class="trainer-compare" id="trainer-compare" aria-label="Trainer comparison"></div>
      <div class="curve-controls" id="curve-controls"></div>
      <div class="chart-toolbar" aria-label="Graph controls">
        <span class="chart-data-note" id="chart-data-note"></span>
        <div class="chart-actions">
          <button type="button" data-chart-action="fit">fit all</button>
          <button type="button" data-chart-action="zoom-out">−</button>
          <button type="button" data-chart-action="zoom-in">+</button>
          <button type="button" data-chart-action="reset">reset</button>
          <button type="button" data-chart-action="fullscreen">expand</button>
        </div>
      </div>
      <div class="chart-shell">
        <canvas id="curve-canvas"></canvas>
        <div class="chart-overlay" id="chart-overlay" aria-live="polite"></div>
        <div class="chart-status" id="curve-status" aria-live="polite"></div>
      </div>
      <div class="chart-legend" id="chart-legend" aria-label="Graph legend"></div>
      <div class="training-grid">
        <div>
          <h3 id="training-status-heading"></h3>
          <dl class="kv" id="training-status"></dl>
        </div>
        <div>
          <h3 id="ending-heading"></h3>
          <canvas id="ending-canvas"></canvas>
          <dl class="kv" id="per-start"></dl>
        </div>
        <div>
          <h3 id="episodes-heading"></h3>
          <table class="episodes" id="episodes"></table>
        </div>
      </div>
      <details>
        <summary id="record-summary"></summary>
        <dl class="kv wide" id="last-record"></dl>
      </details>
    </section>

    <section class="panel" aria-labelledby="params-heading">
      <h2 id="params-heading"></h2>
      <table class="params" id="params"></table>
      <details>
        <summary id="config-summary"></summary>
        <pre id="config-dump"></pre>
      </details>
    </section>
  </main>

  <footer><span id="footer-meta"></span></footer>

  <script type="importmap">
    {"imports": {"three": "/vendor/three/three.module.js"}}
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
